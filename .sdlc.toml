# sdlc plugin repository. dev and main carry the package only; the plugin dogfoods itself on the
# `dogfood` branch, where sdlc/, docs/ and the knowledge bundle are tracked.
[commands]
test = "uv run pytest"
lint = "uv run ruff check plugin/scripts scripts tests && uv run ruff format --check plugin/scripts scripts tests"
build = "claude plugin validate --strict plugin && claude plugin validate --strict ."

[build]
protected_paths = ["uv.lock"]

[deploy]
rollback = "git revert --no-edit HEAD"

[knowledge]
enabled = false             # on this branch; the dogfood branch turns it on with auto_install

[docs]
enabled = false
