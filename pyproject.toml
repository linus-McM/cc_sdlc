[project]
name = "sdlc-plugin"
version = "0.2.2"
description = "Claude Code plugin: six AI-native SDLC stage commands backed by Python gates"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pre-commit>=4.6.2",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 240
target-version = "py311"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
    "PTH", # flake8-use-pathlib
    "RUF", # ruff-specific
]
ignore = [
    "E501",   # line length is the formatter's job
    "RUF001", # σ in strings, comments and docstrings is the statistics term
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["sdlc"]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
# The plugin exists to run git and the commands configured in .sdlc.toml, so
# subprocess use is inherent. B602 (shell=True) is marked inline where needed.
skips = ["B404", "B603", "B607"]

[tool.coverage.run]
source = ["scripts/sdlc"]
