name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [dev]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --group dev
      - name: Unit tests
        run: uv run pytest
      - name: Lint and format
        run: uv run ruff check plugin/scripts scripts tests && uv run ruff format --check plugin/scripts scripts tests
      - name: Pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Plugin manifest
        run: npx --yes @anthropic-ai/claude-code plugin validate --strict plugin && npx --yes @anthropic-ai/claude-code plugin validate --strict .

  version:
    name: version bump into the PR
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Bump plugin/.claude-plugin/plugin.json, .claude-plugin/marketplace.json and pyproject.toml when the PR has not bumped yet
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -eu
          # the manifest lives under plugin/ since 0.3; fall back to the old root path while main still has it
          base_json=$(git show "origin/${BASE_REF}:plugin/.claude-plugin/plugin.json" 2>/dev/null || git show "origin/${BASE_REF}:.claude-plugin/plugin.json")
          base_version=$(printf '%s' "$base_json" | uv run --no-project python -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          part=$(uv run --no-project python -c 'import os, sys; sys.path.insert(0, "scripts"); import bump_version as b; print(b.part_from_labels(os.environ["LABELS"].split(",")))')
          uv run --no-project scripts/bump_version.py --part "$part" --base "$base_version"
          if git diff --quiet; then echo "no bump needed"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/.claude-plugin/plugin.json .claude-plugin/marketplace.json pyproject.toml
          git commit -m "chore: bump version to $(uv run --no-project python -c 'import json; print(json.load(open("plugin/.claude-plugin/plugin.json"))["version"])') ($part, PR #${{ github.event.pull_request.number }})"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
